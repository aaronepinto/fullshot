<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screencappy</title>
  <link rel="icon" href="icons/icon32.png" />
  <link rel="stylesheet" href="editor.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand" title="Screencappy">
      <img src="icons/icon32.png" alt="" width="22" height="22" />
      <span>Screencappy</span>
    </div>

    <div class="toolgroup" id="tools" role="toolbar" aria-label="Annotation tools">
      <button data-tool="select" class="tool active" title="Select / move (V)">
        <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6.5 1.5L16 19l-3 1.5-3.5-6.5L5 18z"/></svg>
      </button>
      <button data-tool="crop" class="tool" title="Crop (C)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 2v15h15M2 7h15v15"/></svg>
      </button>
      <span class="sep"></span>
      <button data-tool="arrow" class="tool" title="Arrow (A)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20L18 6M18 6v7M18 6h-7"/></svg>
      </button>
      <button data-tool="line" class="tool" title="Line (L)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20L20 4"/></svg>
      </button>
      <button data-tool="rect" class="tool" title="Rectangle (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg>
      </button>
      <button data-tool="ellipse" class="tool" title="Ellipse (O)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg>
      </button>
      <button data-tool="pen" class="tool" title="Pen (P)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20c4-1 3-4 6-6l7-7 3 3-7 7c-2 3-5 2-6 6z"/></svg>
      </button>
      <button data-tool="highlight" class="tool" title="Highlighter (H)">
        <svg viewBox="0 0 24 24"><path d="M4 15h16v5H4z" opacity=".5"/><path d="M6 4h12v9H6z"/></svg>
      </button>
      <button data-tool="text" class="tool" title="Text (T)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6V4h14v2M12 4v16m-3 0h6"/></svg>
      </button>
      <button data-tool="blur" class="tool" title="Redact / pixelate (B)">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="5" height="5"/><rect x="14" y="4" width="5" height="5" opacity=".55"/><rect x="9" y="9" width="5" height="5" opacity=".75"/><rect x="4" y="14" width="5" height="5" opacity=".55"/><rect x="14" y="14" width="5" height="5"/></svg>
      </button>
      <button data-tool="emoji" class="tool" title="Emoji stamp (E)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 14a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg>
      </button>
    </div>

    <div class="stylebar" id="stylebar">
      <div class="swatches" id="swatches"></div>
      <label class="ctl" id="ctlWidth" title="Stroke width">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="1.5" rx=".75"/><rect x="3" y="10" width="18" height="3" rx="1.5"/><rect x="3" y="16" width="18" height="5" rx="2.5"/></svg>
        <select id="strokeWidth">
          <option value="3">S</option>
          <option value="6" selected>M</option>
          <option value="10">L</option>
          <option value="16">XL</option>
        </select>
      </label>
      <label class="ctl" id="ctlFont" title="Text size" hidden>
        <span class="ctl-label">Aa</span>
        <select id="fontSize">
          <option value="24">S</option>
          <option value="36" selected>M</option>
          <option value="56">L</option>
          <option value="84">XL</option>
        </select>
      </label>
      <label class="ctl checkbox" id="ctlFill" title="Fill shape">
        <input type="checkbox" id="fillShape" /><span>Fill</span>
      </label>
      <button class="ctl" id="emojiCurrent" title="Pick emoji" hidden>😀</button>
      <div id="emojiPicker" class="popover" hidden></div>
    </div>

    <div class="spacer"></div>

    <div class="actions">
      <button id="btnUndo" class="icon" title="Undo (⌘Z)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      </button>
      <button id="btnRedo" class="icon" title="Redo (⇧⌘Z)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg>
      </button>
      <span class="sep"></span>
      <button id="btnCopy" title="Copy to clipboard (⌘C)">Copy</button>
      <div class="split">
        <button id="btnDownload" class="primary" title="Download (⌘S)">Download PNG</button>
        <button id="btnFormat" class="primary caret" title="Choose format">▾</button>
        <div id="formatMenu" class="popover menu" hidden>
          <button data-format="png">PNG</button>
          <button data-format="jpeg">JPEG</button>
          <button data-format="webp">WebP</button>
          <hr />
          <button data-format="pdf-single">PDF - single page</button>
          <button data-format="pdf-a4">PDF - A4 pages</button>
          <button data-format="pdf-letter">PDF - Letter pages</button>
        </div>
      </div>
      <span class="sep"></span>
      <button id="btnHistory" class="icon" title="Capture history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3.5 2"/></svg>
      </button>
      <button id="btnSettings" class="icon" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2.1 2.1M16.9 16.9L19 19M19 5l-2.1 2.1M7.1 16.9L5 19"/></svg>
      </button>
    </div>
  </header>

  <main id="viewport">
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p id="loadingMsg">Stitching your capture…</p>
    </div>
    <div id="textEditor" data-testid="text-editor" hidden>
      <textarea rows="1" spellcheck="false" placeholder="Type…" data-testid="text-input"></textarea>
      <div id="textHint" data-testid="text-hint" role="status" aria-live="polite">
        <kbd>Enter</kbd> to apply · <kbd>⇧Enter</kbd> for a new line · <kbd>Esc</kbd> to cancel
      </div>
    </div>
    <div id="cropBar" class="floatbar" hidden>
      <span id="cropDims"></span>
      <button id="cropApply" class="primary">Apply crop</button>
      <button id="cropCancel">Cancel</button>
    </div>
    <div id="ctxMenu" class="popover menu" hidden>
      <button id="ctxCopy">Copy image</button>
      <button id="ctxDownload">Download</button>
    </div>
    <div id="emptyState" class="empty" hidden>
      <img src="icons/icon128.png" alt="" width="72" />
      <h2>No capture selected</h2>
      <p>Pick a capture from the history panel, or capture a page with <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd>.</p>
    </div>
  </main>

  <footer class="statusbar">
    <span id="statDims"></span>
    <button id="btnCropReset" class="chip" hidden>Reset crop</button>
    <span id="statNote" class="note"></span>
    <span class="spacer"></span>
    <a id="statUrl" target="_blank" rel="noreferrer"></a>
    <span class="sep"></span>
    <div class="zoomctl">
      <button id="zoomOut" title="Zoom out">−</button>
      <button id="zoomFit" title="Fit width">Fit</button>
      <button id="zoom100" title="Actual size">100%</button>
      <button id="zoomIn" title="Zoom in">+</button>
      <span id="statZoom"></span>
    </div>
  </footer>

  <aside id="history" hidden>
    <header>
      <h2>History</h2>
      <button id="historyClose" class="icon" title="Close">✕</button>
    </header>
    <p class="history-hint">Captures are stored locally on this device only.</p>
    <ul id="historyList"></ul>
  </aside>

  <div id="toast" class="toast" hidden></div>

  <script src="editor.js"></script>
</body>
</html>
