<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Screencappy e2e virtualized fixture</title>
  <style>
    /* A LinkedIn/Gemini style virtualized feed: the page is 6000px tall because of the
       spacer, but only the rows near the viewport exist in the DOM, and they stream in
       one at a time over the best part of a second after each scroll. A capture that
       shoots on a fixed delay catches the list half built and the bottom of the tile
       comes back blank, which is the "missed the bottom third" complaint. */
    html, body { margin: 0; background: #fff; font: 20px/1.4 system-ui, sans-serif; }
    #feed { position: relative; }
    .row {
      position: absolute; left: 0; right: 0; height: 120px; box-sizing: border-box;
      display: flex; align-items: center; padding: 0 24px; color: #0f172a;
    }
  </style>
</head>
<body>
  <div id="feed"></div>
  <script>
    const ROWS = 50;
    const ROW_H = 120;
    const OVERSCAN = 1;
    // The first row lands well inside a fixed settle; the rest arrive top to bottom at
    // one every STAGGER_MS, so a viewport worth of rows takes ~750ms to fill in. The
    // bottom rows are only there for a capture that waits for the page to go quiet.
    const FIRST_DELAY_MS = 120;
    const STAGGER_MS = 70;

    const feed = document.getElementById('feed');
    feed.style.height = ROWS * ROW_H + 'px';

    let timers = [];
    function render() {
      for (const t of timers) clearTimeout(t);
      timers = [];
      const first = Math.max(0, Math.floor(window.scrollY / ROW_H) - OVERSCAN);
      const last = Math.min(
        ROWS - 1,
        Math.ceil((window.scrollY + window.innerHeight) / ROW_H) + OVERSCAN
      );
      feed.textContent = '';
      for (let i = first; i <= last; i++) {
        timers.push(
          setTimeout(() => {
            const row = document.createElement('div');
            row.className = 'row';
            row.style.top = i * ROW_H + 'px';
            // Distinct hue per row, so a duplicated or missing region shows up in a
            // pixel sample: 37 degree steps never repeat across 50 rows.
            row.style.background = 'hsl(' + ((i * 37) % 360) + ' 70% 60%)';
            row.textContent = 'Row ' + i + ' at y=' + i * ROW_H;
            feed.appendChild(row);
          }, FIRST_DELAY_MS + (i - first) * STAGGER_MS)
        );
      }
    }

    addEventListener('scroll', render);
    render();
  </script>
</body>
</html>
