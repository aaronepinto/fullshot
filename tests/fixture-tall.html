<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Screencappy e2e very tall page fixture</title>
  <style>
    /* Height ceilings. ?h= sets the total document height:
       20000 crosses Chrome's 16384px compositor texture limit, which is where
       competitors silently crop; 40000 is memory pressure, a page whose tiles a naive
       engine holds all at once; 33554432 is the value a real docs site was observed
       reporting for document.body.scrollHeight, which crashes Playwright's full-page
       screenshot outright and is not a length any engine should try to walk.
       A solid band at each end makes truncation a single-pixel assertion: if the bottom
       band is not at the bottom of the composed image, the capture was cropped.
       ?content= sets how much real content sits at the top before the spacer, so the
       impossible-height variants can tell apart a capture that stopped at the last
       content (two screens of it) and one that took the visible area only (one screen).
       The top band is striped rather than flat: a capture that stops at the last painted
       tile has to be able to tell content from spacer, and a flat colour is not content
       any test could distinguish from an empty one. */
    body { margin: 0; font: 700 64px/1 system-ui, sans-serif; color: #fff; }
    #top {
      background: rgb(14, 165, 233);
      background-image: repeating-linear-gradient(
        90deg, rgba(255, 255, 255, .25) 0 40px, rgba(255, 255, 255, 0) 40px 80px
      );
    }
    #bottom { height: 200px; background: rgb(236, 72, 153); }
    /* Blank, the way a broken page's phantom height really is. */
    #spacer { background: #fff; }
  </style>
</head>
<body>
  <div id="top">top band</div>
  <div id="spacer"></div>
  <div id="bottom">bottom band</div>
  <script>
    const params = new URLSearchParams(location.search);
    const h = Number(params.get('h') ?? 20000);
    const content = Number(params.get('content') ?? 200);
    document.getElementById('top').style.height = content + 'px';
    document.getElementById('spacer').style.height = Math.max(0, h - content - 200) + 'px';
    // Chrome clamps element heights near 2^25, so the reported height is worth logging
    // rather than assuming: this is exactly the number the engine has to cope with.
    addEventListener('load', () => {
      document.title = 'tall ' + document.documentElement.scrollHeight;
    });
  </script>
</body>
</html>
