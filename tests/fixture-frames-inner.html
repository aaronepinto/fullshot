<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Screencappy e2e frame, one deep</title>
  <style>
    /* 600px of content in a 400px frame, so this frame scrolls its own overflow, and a
       further same-origin frame nested inside it: the depth competitors report broken. */
    body { margin: 0; font: 700 28px/200px system-ui, sans-serif; color: rgba(255,255,255,.75); }
    div { height: 200px; padding-left: 24px; position: relative; }
    /* Absolutely positioned and clipped, so the label can neither change the layout nor
       reach a sampled column. A sample that merely looks clear of the text on the machine
       the fixture was written on is not clear where system-ui resolves to a wider family,
       which is exactly how this fixture first failed in CI. */
    .label { position: absolute; left: 24px; top: 0; max-width: 100px; overflow: hidden; white-space: nowrap; }

    iframe { display: block; width: 100%; height: 200px; border: 0; }
  </style>
</head>
<body>
  <div style="background: rgb(16, 90, 160)"><span class="label">Frame, one deep</span></div>
  <iframe src="/frames-deep"></iframe>
  <div style="background: rgb(17, 90, 160)"><span class="label">Below the nested frame</span></div>
</body>
</html>
