name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      # The build renders the icons, and it renders them in a real browser.
      # Pinned the same way as the end-to-end matrix rather than relying on
      # whatever Chrome the runner image happens to ship.
      - uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        id: chrome
        with:
          chrome-version: stable
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests (with coverage floor)
        run: bun run test
      - name: Build
        run: bun run build
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: Pack
        run: cd dist && zip -r -X ../screencappy.zip .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screencappy-${{ github.sha }}
          path: screencappy.zip

  # One packed extension, every Chromium browser we can install on a hosted
  # runner. tests/e2e.mjs is shared: only the binary behind CHROME changes.
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # A failure in one browser is a result about that browser, not a reason to
      # stop learning about the others.
      fail-fast: false
      matrix:
        browser: [chrome, edge, brave]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        if: matrix.browser == 'chrome'
        id: chrome
        with:
          chrome-version: stable
      - uses: browser-actions/setup-edge@e2f31d5d9f2e6d75e72516221b4df8528e6325cf # v1
        if: matrix.browser == 'edge'
        id: edge
        with:
          edge-version: stable
      # There is no setup action for Brave, so it comes from Brave's own apt
      # repository, which is the install path Brave documents for Debian/Ubuntu.
      - name: Install Brave
        if: matrix.browser == 'brave'
        run: |
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg \
            https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          sudo curl -fsSLo /etc/apt/sources.list.d/brave-browser-release.sources \
            https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
          sudo apt-get update
          sudo apt-get install -y brave-browser

      - name: Resolve the browser binary
        run: |
          case "$BROWSER" in
            chrome) binary=$CHROME_PATH ;;
            edge) binary=$EDGE_PATH ;;
            brave) binary=$(command -v brave-browser) ;;
            *) echo "No binary rule for $BROWSER"; exit 1 ;;
          esac
          test -x "$binary" || { echo "$BROWSER did not install: '$binary' is not executable"; exit 1; }
          "$binary" --version
          echo "CHROME=$binary" >> "$GITHUB_ENV"
        env:
          BROWSER: ${{ matrix.browser }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          EDGE_PATH: ${{ steps.edge.outputs.edge-path }}

      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: End-to-end capture test
        run: bun run e2e
        env:
          BROWSER: ${{ matrix.browser }}

  # Firefox ships from the same source through a different manifest, so it gets
  # its own build, Mozilla's own linter, and a real capture run under geckodriver.
  e2e-firefox:
    name: e2e (firefox)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        id: firefox
        with:
          firefox-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build:firefox
      # addons-linter, the same validator AMO runs at submission. It exits
      # non-zero on errors only, which is what we want: the build currently
      # carries warnings for the debugger calls that Firefox does not implement,
      # and those are guarded at runtime rather than removed from the bundle.
      - name: Validate with Mozilla's add-on linter
        run: bun run lint:firefox
      # geckodriver is fetched by Selenium Manager, which ships inside
      # selenium-webdriver, so there is nothing to install for it here.
      - name: End-to-end capture test
        run: bun run e2e:firefox
        env:
          FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
