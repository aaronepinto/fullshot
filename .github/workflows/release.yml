# Automated releases via release-please: merges to main with Conventional Commit
# messages accumulate into a release PR; merging that PR tags a semver release,
# builds the extension zip, and attaches it to the GitHub Release. Publishing to
# the Chrome Web Store is opt-in via the PUBLISH_TO_CWS repo variable + secrets.
name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  upload-assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      # Every build target renders the icons in a real browser first.
      - uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        id: chrome
        with:
          chrome-version: stable
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - run: bun run build:firefox
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - run: bun run build:store-fallback
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: Pack
        run: |
          (cd dist && zip -r -X ../screencappy.zip .)
          (cd dist-firefox && zip -r -X ../screencappy-firefox.zip .)
          (cd dist-store-fallback && zip -r -X ../screencappy-store.zip .)
      - name: Attach zips to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ needs.release-please.outputs.tag_name }}"
          screencappy.zip screencappy-firefox.zip screencappy-store.zip --clobber

  publish-cws:
    needs: [release-please, upload-assets]
    if: needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_TO_CWS == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        id: chrome
        with:
          chrome-version: stable
      - run: bun install --frozen-lockfile
      - run: bun run build:store-fallback
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: Pack
        run: cd dist-store-fallback && zip -r -X ../screencappy-store.zip .
      - name: Upload & publish to Chrome Web Store
        run: >
          bunx chrome-webstore-upload-cli@3 upload
          --source screencappy-store.zip
          --extension-id "$EXTENSION_ID"
          --client-id "$CLIENT_ID"
          --client-secret "$CLIENT_SECRET"
          --refresh-token "$REFRESH_TOKEN"
          --auto-publish
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}

  # First Edge submission is manual in Partner Center (the API cannot create
  # products or edit metadata); after that, this pushes each release's package.
  publish-edge:
    needs: [release-please, upload-assets]
    if: needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_TO_EDGE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build:store-fallback
      - name: Pack
        run: cd dist-store-fallback && zip -r -X ../screencappy-store.zip .
      - name: Upload package to Edge Add-ons
        env:
          PRODUCT: ${{ secrets.EDGE_PRODUCT_ID }}
          CLIENT: ${{ secrets.EDGE_CLIENT_ID }}
          APIKEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          base="https://api.addons.microsoftedge.microsoft.com/v1/products/$PRODUCT"
          hdr=(-H "Authorization: ApiKey $APIKEY" -H "X-ClientID: $CLIENT")
          op=$(curl -sf -D - -o /dev/null "${hdr[@]}" -H "Content-Type: application/zip"                 --data-binary @screencappy-store.zip -X POST "$base/submissions/draft/package"                 | tr -d '\r' | awk -F/ 'tolower($0) ~ /^location:/ {print $NF}')
          test -n "$op" || { echo "no operation id returned"; exit 1; }
          for i in $(seq 1 30); do
            status=$(curl -sf "${hdr[@]}" "$base/submissions/draft/package/operations/$op" | jq -r .status)
            echo "upload: $status"
            [ "$status" = "Succeeded" ] && break
            [ "$status" = "Failed" ] && exit 1
            sleep 10
          done
          [ "$status" = "Succeeded" ] || exit 1
          pub=$(curl -sf -D - -o /dev/null "${hdr[@]}" -H "Content-Type: application/json"                 -d '{"notes":"Automated release publish"}' -X POST "$base/submissions"                 | tr -d '\r' | awk -F/ 'tolower($0) ~ /^location:/ {print $NF}')
          echo "publish operation: $pub"

  # AMO reviews every listed version; web-ext sign submits and exits once the
  # upload is validated, without waiting for human review.
  publish-firefox:
    needs: [release-please, upload-assets]
    if: needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_TO_AMO == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build:firefox
      # AMO requires human readable source for bundled code; ship the exact
      # release commit so reviewers can rebuild with bun install && bun run
      # build:firefox.
      - name: Archive source for AMO review
        run: git archive --format=zip --output "$RUNNER_TEMP/screencappy-source.zip" HEAD
      - name: Submit to AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: bunx web-ext sign --source-dir dist-firefox --channel listed --no-input --upload-source-code "$RUNNER_TEMP/screencappy-source.zip"
