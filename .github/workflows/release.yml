# Automated releases via release-please: merges to main with Conventional Commit
# messages accumulate into a release PR; merging that PR tags a semver release,
# builds the extension zip, and attaches it to the GitHub Release. Publishing to
# the Chrome Web Store is opt-in via the PUBLISH_TO_CWS repo variable + secrets.
name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  upload-assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      # Every build target renders the icons in a real browser first.
      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        id: chrome
        with:
          chrome-version: stable
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - run: bun run build:firefox
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - run: bun run build:store-fallback
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: Pack
        run: |
          (cd dist && zip -r -X ../screencappy.zip .)
          (cd dist-firefox && zip -r -X ../screencappy-firefox.zip .)
          (cd dist-store-fallback && zip -r -X ../screencappy-store.zip .)
      - name: Attach zips to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ needs.release-please.outputs.tag_name }}"
          screencappy.zip screencappy-firefox.zip screencappy-store.zip --clobber

  publish-cws:
    needs: [release-please, upload-assets]
    if: needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_TO_CWS == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        id: chrome
        with:
          chrome-version: stable
      - run: bun install --frozen-lockfile
      - run: bun run build:store-fallback
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: Pack
        run: cd dist-store-fallback && zip -r -X ../screencappy-store.zip .
      - name: Upload & publish to Chrome Web Store
        run: >
          bunx chrome-webstore-upload-cli@3 upload
          --source screencappy-store.zip
          --extension-id "$EXTENSION_ID"
          --client-id "$CLIENT_ID"
          --client-secret "$CLIENT_SECRET"
          --refresh-token "$REFRESH_TOKEN"
          --auto-publish
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
