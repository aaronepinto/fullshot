name: ✨ Feature request
description: Suggest a capability or an improvement
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, it is worth knowing the two hard constraints on this project,
        because they rule out otherwise reasonable ideas:

        - **Zero runtime dependencies.** Nothing in the extension imports a package.
        - **No network code.** No accounts, no sync, no cloud upload, no telemetry, ever.

        A feature that needs either of those will be declined regardless of how good it is.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched [existing issues and discussions](https://github.com/aaronepinto/smollet-screencappy/issues?q=is%3Aissue) and this is not a duplicate.
          required: true
        - label: This does not require network access or a runtime dependency.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
      description: >
        Describe the situation you are in, not the solution you have in mind. The best
        feature requests are a story about a capture that was annoying to take.
      placeholder: "When I capture a long changelog page, I want to ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like Screencappy to do
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: Workarounds, other tools, or manual steps. This helps gauge how much the feature is worth.

  - type: dropdown
    id: area
    attributes:
      label: Which part of Screencappy
      options:
        - Capture (full page, visible, region)
        - Editor and annotation tools
        - Export (PNG, JPEG, WebP, PDF, clipboard)
        - Capture history
        - Settings and filename templates
        - Keyboard shortcuts
        - Something else
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
